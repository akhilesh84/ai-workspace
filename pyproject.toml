[project]
name = "ai-workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Akhilesh Yadav", email = "akhilesh84@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.4",
