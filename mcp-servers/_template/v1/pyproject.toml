[project]
name = "mcp-server-template"
version = "0.1.0"
description = "Template MCP server built with FastMCP and Python"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
serve = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]
