[project]
name = "nifty-energy-basket"
version = "0.1.0"
description = "Nifty Energy Quality Basket Valuation MCP Server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0",
]

[project.scripts]
serve = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

